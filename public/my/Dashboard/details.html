<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Details</title>
    <link rel="stylesheet" href="css/details.css" />
</head>

<body>

    <button id="backBtn">Back</button>

    <h2 id="tableTitle"></h2>
 <div class="table-box">
  <div class="table-toolbar">
    <div id="recordCount" class="recordCount" style="background-color: #fff;padding: 10px;"></div>

    <button id="clearAllFilters" class="clear-all-btn" style="display:none;">
        Clear All Filters
    </button>
</div>
    <!-- Search, Filter & Sort -->
   

    <table id="userTable">
        <thead>
    <tr>
        <th data-column="name">
            Name <span class="filter-icon">▼</span>
        </th>

        <th data-column="designation">
            Designation <span class="filter-icon">▼</span>
        </th>

        <th data-column="department">
            Department <span class="filter-icon">▼</span>
        </th>

        <th data-column="branch">
            Branch <span class="filter-icon">▼</span>
        </th>

        <th data-column="status">
            Status <span class="filter-icon">▼</span>
        </th>

        <th data-column="lastAccess">
            Last Access <span class="filter-icon">▼</span>
        </th>
    </tr>
</thead>

        <tbody></tbody>
    </table>
        <div class="pagination-container">

    <div class="rows-per-page">

        <b>Rows per page:</b>

        <select id="rowsPerPage">

            <option value="10">
                10
            </option>

            <option value="25" selected>
                25
            </option>

            <option value="50">
                50
            </option>

            <option value="100">
                100
            </option>

        </select>

    </div>

    <div id="pagination"></div>
</div>  
    <div id="filterMenu" class="filter-menu hidden"></div>


    <script src="js/details.js"></script>

</body>
</html>
